<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logo spacing slide</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff}
.slide{position:relative;width:1920px;height:1080px;background:#fff;color:#000;font-family:Inter,system-ui,sans-serif;border-top:2px solid #000;overflow:hidden}
.rule{position:absolute;top:34px;height:2px;background:#000}
.rl{left:27px;width:455px}.rr{left:498px;width:1395px}
.head{position:absolute;left:498px;top:52px;font-size:20px;line-height:24px}.head b{font-weight:600;display:block}
.text{position:absolute;left:27px;top:230px;width:440px;font-size:20px;line-height:25px}
.text p{margin:0 0 20px}
.grid{position:absolute;left:498px;top:230px;width:1398px;height:799px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel{border-radius:14px;background:#F5F5F5;overflow:hidden}.panel svg{display:block;width:100%;height:100%}
.sym{position:absolute;left:27px;bottom:30px;width:50px;height:50px}
.lbl{font:400 12px Inter,system-ui,sans-serif;fill:#737373}
</style></head><body><div class="slide">
<div class="rule rl"></div><div class="rule rr"></div>
<div class="head"><b>Logo</b>Spacing between logos</div>
<div class="text"><p>When two logos sit side by side or stacked, keep 2x of space between them.</p><p>x is the width of the "s" in the wordmark.</p><p>The space is the same in a horizontal and a vertical arrangement.</p></div>
<div class="grid"><div class="panel"><svg id="a" viewBox="0 0 690 799"></svg></div><div class="panel"><svg id="b" viewBox="0 0 690 799"></svg></div></div>
<img class="sym" src="logos/masumi/masumi-symbol.svg" alt="Masumi symbol">
</div>
<script>
